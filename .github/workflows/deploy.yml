name: Deploy to GitHub Pages
on:
  push: { branches: [main, master] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Set base path
        # user/org site (<owner>.github.io repo) -> no base path; project site -> /<repo>
        # (done in shell: an empty string is falsy in `cond && '' || x` expressions)
        run: |
          case "$GITHUB_REPOSITORY" in
            *.github.io) echo "BASE_PATH=" >> "$GITHUB_ENV" ;;
            *) echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV" ;;
          esac
      - name: Build
        run: npm run build
        env:
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
